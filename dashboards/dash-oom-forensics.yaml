apiVersion: v1
kind: ConfigMap
metadata:
  name: dash-oom-forensics
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  oom-forensics.json: |
    {
      "title": "OOM Forensics — Metrics + Logs + Network",
      "uid": "oom-forensics",
      "schemaVersion": 39,
      "version": 1,
      "tags": ["oom","forensics","loki","thanos"],
      "timezone": "browser",
      "time": { "from": "now-3h", "to": "now" },
      "refresh": "30s",
      "links": [
        {
          "title": "Back to OOMKilled — Thanos Deep Dive",
          "type": "link",
          "url": "/d/oomkilled-thanos",
          "targetBlank": false
        }
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Thanos", "value": "Thanos" }
          },
          {
            "name": "loki",
            "type": "datasource",
            "query": "loki",
            "current": { "text": "Loki", "value": "Loki" }
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": "label_values(kube_pod_info, namespace)",
            "includeAll": false, "multi": false, "refresh": 2
          },
          {
            "name": "pod",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": "label_values(kube_pod_info{namespace=\"$namespace\"}, pod)",
            "includeAll": false, "multi": false, "refresh": 2
          },
          {
            "name": "container",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": "label_values(container_memory_working_set_bytes{namespace=\"$namespace\",pod=\"$pod\",container!=\"\",container!=\"POD\"}, container)",
            "includeAll": true, "multi": true, "refresh": 2
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "name": "OOMKill events",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "enable": true,
            "iconColor": "red",
            "target": {
              "expr": "changes(kube_pod_container_status_restarts_total{namespace=\"$namespace\",pod=\"$pod\"}[5m]) > 0 and on(namespace,pod,container) kube_pod_container_status_last_terminated_reason{reason=\"OOMKilled\"} == 1",
              "legendFormat": "OOM {{container}}"
            }
          },
          {
            "name": "Pod restarts (any reason)",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "enable": false,
            "iconColor": "orange",
            "target": {
              "expr": "changes(kube_pod_container_status_restarts_total{namespace=\"$namespace\",pod=\"$pod\"}[5m]) > 0",
              "legendFormat": "restart {{container}}"
            }
          }
        ]
      },
      "panels": [

        { "type": "row", "title": "Overview", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }, "collapsed": false },

        {
          "type": "stat",
          "title": "Current memory / limit",
          "description": "**Aktueller Speicher geteilt durch Limit**\n\nMomentwert des Verhältnisses `working_set / memory_limit` für den ausgewählten Pod/Container.\n\n**Query:** `max(container_memory_working_set_bytes) / max(kube_pod_container_resource_limits{resource=\"memory\"})`\n\n**Farbcode:**\n- Grün: < 80 %\n- Orange: 80–95 %\n- Rot: > 95 % (OOM wahrscheinlich)",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "max(container_memory_working_set_bytes{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\",container!=\"\",container!=\"POD\"}) / max(kube_pod_container_resource_limits{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\",resource=\"memory\"})"
          }],
          "fieldConfig": { "defaults": { "unit": "percentunit", "thresholds": { "mode": "absolute",
            "steps": [{"color":"green","value":null},{"color":"orange","value":0.8},{"color":"red","value":0.95}] } } }
        },
        {
          "type": "stat",
          "title": "Peak memory in range",
          "description": "**Höchster Speicherverbrauch im aktuellen Zeitfenster**\n\nMaximalwert von `working_set_bytes` über den im Dashboard oben rechts eingestellten Zeitraum.\n\n**Query:** `max(max_over_time(container_memory_working_set_bytes[$__range]))`\n\n**Nutzung:** Als Basis für die Dimensionierung des Memory-Limits — Faustregel: `Limit ≥ Peak × 1.3`.",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "max(max_over_time(container_memory_working_set_bytes{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\",container!=\"\",container!=\"POD\"}[$__range]))"
          }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "type": "stat",
          "title": "Container restarts",
          "description": "**Gesamtzahl der Container-Neustarts**\n\nSumme aller Restarts seit Pod-Erstellung (nicht nur im Zeitfenster — Zähler ist kumulativ).\n\n**Query:** `sum(kube_pod_container_status_restarts_total)`\n\n**Interpretation:**\n- 0 → stabil\n- Einzelne Restarts → einmaliger Vorfall\n- Schnell steigender Zähler → CrashLoopBackOff, Container kann sich nicht halten",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "sum(kube_pod_container_status_restarts_total{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\"})"
          }]
        },
        {
          "type": "stat",
          "title": "OOMKills in range",
          "description": "**OOMKills für diesen Pod im aktuellen Zeitfenster**\n\nAnzahl der Terminierungen mit Grund `OOMKilled` für den ausgewählten Pod/Container.\n\n**Query:** `sum(increase(kube_pod_container_status_terminated_reason{reason=\"OOMKilled\"}[$__range]))`\n\n- Grün: 0 — kein OOM aufgetreten\n- Rot: ≥ 1 — mindestens ein OOM, siehe Memory-Panel für Zeitpunkt",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "sum(increase(kube_pod_container_status_terminated_reason{reason=\"OOMKilled\",namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\"}[$__range]))"
          }],
          "fieldConfig": { "defaults": { "thresholds": { "mode": "absolute",
            "steps": [{"color":"green","value":null},{"color":"red","value":1}] } } }
        },

        { "type": "row", "title": "Memory", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 }, "collapsed": false },

        {
          "type": "timeseries",
          "title": "Working set vs limit vs request",
          "description": "**Speicher-Zeitverlauf mit Referenzlinien für Limit und Request**\n\nDarstellung von Working-Set, RSS und Cache im Zeitverlauf. Limit (rot, gestrichelt) und Request (blau, gestrichelt) dienen als Referenzlinien.\n\n**Metriken:**\n- `working_set` — der Wert, den der OOM-Killer betrachtet (wichtigste Kurve)\n- `rss` — Resident Set Size (tatsächlicher Heap-Speicher des Prozesses)\n- `cache` — Page-Cache (vom Kernel wiederverwendbar, zählt NICHT als OOM-Grund)\n- `limit` — konfiguriertes `resources.limits.memory`\n- `request` — konfiguriertes `resources.requests.memory` (für Scheduling relevant)\n\n**Lesehilfe:**\n- Working-Set nähert sich dem Limit → bald OOM\n- Working-Set deutlich unter Limit, aber OOM passiert → Node-Druck oder Kernel-OOM\n- Große Cache-Anteile → OK, werden bei Druck zurückgegeben",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 7 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "expr": "container_memory_working_set_bytes{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\",container!=\"\",container!=\"POD\"}",
              "legendFormat": "working_set {{container}}"
            },
            {
              "expr": "kube_pod_container_resource_limits{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\",resource=\"memory\"}",
              "legendFormat": "limit {{container}}"
            },
            {
              "expr": "kube_pod_container_resource_requests{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\",resource=\"memory\"}",
              "legendFormat": "request {{container}}"
            },
            {
              "expr": "container_memory_rss{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\",container!=\"\",container!=\"POD\"}",
              "legendFormat": "rss {{container}}"
            },
            {
              "expr": "container_memory_cache{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\",container!=\"\",container!=\"POD\"}",
              "legendFormat": "cache {{container}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes", "custom": { "fillOpacity": 10 } },
            "overrides": [
              { "matcher": { "id": "byRegexp", "options": "^limit .*" },
                "properties": [{ "id": "custom.lineStyle", "value": { "fill": "dash" } },
                               { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }] },
              { "matcher": { "id": "byRegexp", "options": "^request .*" },
                "properties": [{ "id": "custom.lineStyle", "value": { "fill": "dash" } },
                               { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } }] }
            ]
          }
        },

        {
          "type": "timeseries",
          "title": "Memory deriv (leak detector)",
          "description": "**Memory-Ableitung — der Leak-Detektor**\n\n`deriv()` berechnet die Steigung der Speichernutzung in Bytes pro Sekunde über die letzten 5 Minuten.\n\n**Query:** `deriv(container_memory_working_set_bytes[5m])`\n\n**Interpretation:**\n- Konstant positiv über Stunden → Memory-Leak (Heap-Dump ziehen!)\n- Oszillierend um 0 → GC arbeitet normal\n- Scharfe Spitzen → Request-getriebene Allokationen (Pattern B)\n- Negativ nach einem Deploy → Fix hat gegriffen",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "deriv(container_memory_working_set_bytes{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\",container!=\"\",container!=\"POD\"}[5m])",
            "legendFormat": "{{container}}"
          }],
          "fieldConfig": { "defaults": { "unit": "Bps" } }
        },

        {
          "type": "timeseries",
          "title": "Page faults (major)",
          "description": "**Major Page Faults — Kernel muss Speicher von Disk laden**\n\nRate der Major Page Faults. Jeder Fault bedeutet, dass der Kernel eine Speicherseite von der Disk lesen musste.\n\n**Query:** `rate(container_memory_failures_total{failure_type=\"pgmajfault\"}[$__rate_interval])`\n\n**Interpretation:**\n- Konstant nahe 0 → normal\n- Hoher Wert → Speicher-Druck, System beginnt zu swappen (falls aktiv) oder Pages werden ständig geladen\n- Ansteigend vor einem OOM → der Kernel versucht verzweifelt, Speicher freizumachen",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "rate(container_memory_failures_total{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\",failure_type=\"pgmajfault\"}[$__rate_interval])",
            "legendFormat": "pgmajfault {{container}}"
          }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },

        { "type": "row", "title": "CPU", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 }, "collapsed": false },

        {
          "type": "timeseries",
          "title": "CPU usage vs limit",
          "description": "**CPU-Nutzung im Vergleich zum Limit**\n\nTatsächlicher CPU-Verbrauch (Cores) gegen das konfigurierte CPU-Limit.\n\n**Query:** `rate(container_cpu_usage_seconds_total[$__rate_interval])`\n\n**Interpretation:**\n- Nutzung am Limit → potenziell Request-Stau → mehr Speicher wird gepuffert → OOM-Risiko steigt\n- Nutzung weit unter Limit, aber Throttling im Nachbar-Panel → Scheduler-Kontention oder Limits zu niedrig angesetzt",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 25 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "rate(container_cpu_usage_seconds_total{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\",container!=\"\",container!=\"POD\"}[$__rate_interval])", "legendFormat": "usage {{container}}" },
            { "expr": "kube_pod_container_resource_limits{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\",resource=\"cpu\"}", "legendFormat": "limit {{container}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "cores" } }
        },

        {
          "type": "timeseries",
          "title": "CPU throttling (high throttling often precedes OOM)",
          "description": "**CPU Throttling — hohes Throttling geht OOMs oft voraus**\n\nZeit in Sekunden, in der der Container vom CFS-Scheduler gedrosselt wurde.\n\n**Query:** `rate(container_cpu_cfs_throttled_seconds_total[$__rate_interval])`\n\n**Warum relevant für OOM?**\nWenn die App gedrosselt wird, kann sie Requests/Queues nicht rechtzeitig abarbeiten — Puffer wachsen im Speicher an, bis das Limit erreicht ist. Throttling ist oft ein Vorbote des eigentlichen OOMs.\n\n**Maßnahme:** CPU-Limit anheben oder entfernen (CPU-Requests reichen für Scheduling).",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 25 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "rate(container_cpu_cfs_throttled_seconds_total{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\",container!=\"\",container!=\"POD\"}[$__rate_interval])",
            "legendFormat": "throttled {{container}}"
          }],
          "fieldConfig": { "defaults": { "unit": "s" } }
        },

        { "type": "row", "title": "Network", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 33 }, "collapsed": false },

        {
          "type": "timeseries",
          "title": "Network bytes (rx/tx)",
          "description": "**Netzwerk-Bytes pro Sekunde (Empfang / Senden)**\n\nAn der Pod-Netzwerkschnittstelle gemessener Durchsatz.\n\n**Query:** `rate(container_network_receive_bytes_total[...])` und `rate(container_network_transmit_bytes_total[...])`\n\n**OOM-Korrelation:**\n- Peak bei rx unmittelbar vor OOM → große Response wurde komplett in den Speicher gepuffert (Pattern B: Request-Spike)\n- Hohe tx-Rate → App streamt Ergebnisse, evtl. ohne Backpressure → Heap wächst\n- Niedrige Werte, aber OOM → kein Netzwerk-Trigger, eher interner Leak",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 34 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "rate(container_network_receive_bytes_total{namespace=\"$namespace\",pod=\"$pod\"}[$__rate_interval])", "legendFormat": "rx {{interface}}" },
            { "expr": "rate(container_network_transmit_bytes_total{namespace=\"$namespace\",pod=\"$pod\"}[$__rate_interval])", "legendFormat": "tx {{interface}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps" } }
        },

        {
          "type": "timeseries",
          "title": "Packets dropped / errors",
          "description": "**Verworfene Pakete und Fehler**\n\nPakete, die das Kernel-Netzwerk-Subsystem verwerfen musste (Queue voll, Buffer zu klein, Checksummen-Fehler).\n\n**Queries:** `rate(container_network_{receive,transmit}_packets_dropped_total[...])` und `_errors_total`\n\n**Interpretation:**\n- Drops auf rx ansteigend → CNI-Buffer überlastet, App kann Traffic nicht schnell genug abnehmen (CPU-Throttling prüfen)\n- Plötzliche Error-Spikes → Netzwerkproblem auf Node-Ebene (MTU, NIC)\n- Korrelation mit OOM → Pod war speicherseitig so ausgelastet, dass Netzwerk-Callbacks ausfielen",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 34 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "rate(container_network_receive_packets_dropped_total{namespace=\"$namespace\",pod=\"$pod\"}[$__rate_interval])", "legendFormat": "rx drop {{interface}}" },
            { "expr": "rate(container_network_transmit_packets_dropped_total{namespace=\"$namespace\",pod=\"$pod\"}[$__rate_interval])", "legendFormat": "tx drop {{interface}}" },
            { "expr": "rate(container_network_receive_errors_total{namespace=\"$namespace\",pod=\"$pod\"}[$__rate_interval])", "legendFormat": "rx err {{interface}}" },
            { "expr": "rate(container_network_transmit_errors_total{namespace=\"$namespace\",pod=\"$pod\"}[$__rate_interval])", "legendFormat": "tx err {{interface}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "pps" } }
        },

        { "type": "row", "title": "Filesystem", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 42 }, "collapsed": false },

        {
          "type": "timeseries",
          "title": "Container filesystem usage",
          "description": "**Belegung des Container-Dateisystems**\n\nBelegter Speicher des EmptyDir/overlayfs/PVC je Device.\n\n**Query:** `container_fs_usage_bytes`\n\n**Relevanz für OOM:**\n- Wachsende FS-Belegung + wachsender Working-Set → evtl. eine disk-basierte Cache-Explosion, die auch Memory-Pages reserviert\n- Plötzlicher Drop → Log-Rotation oder Cleanup-Job\n- Wird NICHT vom OOM-Killer bewertet, kann aber auf DiskPressure-Evictions hindeuten",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 43 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "expr": "container_fs_usage_bytes{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\",container!=\"\",container!=\"POD\"}",
            "legendFormat": "{{container}} {{device}}"
          }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "type": "timeseries",
          "title": "Disk I/O (rate)",
          "description": "**Disk-I/O-Rate — Lese- und Schreibbytes pro Sekunde**\n\nI/O-Durchsatz des Containers.\n\n**Queries:** `rate(container_fs_reads_bytes_total[...])` / `rate(container_fs_writes_bytes_total[...])`\n\n**Interpretation:**\n- Hohe Write-Rate → starke Log-Produktion oder DB-Writes → prüfen, ob Logs im Heap gepuffert werden\n- Hohe Read-Rate vor OOM → App lädt große Dateien in den Speicher (z. B. ML-Modell, Dataset)\n- Konstante I/O im Normalbetrieb → Baseline etablieren, Abweichungen beachten",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 43 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "expr": "rate(container_fs_reads_bytes_total{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\"}[$__rate_interval])", "legendFormat": "read {{container}}" },
            { "expr": "rate(container_fs_writes_bytes_total{namespace=\"$namespace\",pod=\"$pod\",container=~\"$container\"}[$__rate_interval])", "legendFormat": "write {{container}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps" } }
        },

        { "type": "row", "title": "JVM runtime (if jmx_exporter present)", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 51 }, "collapsed": true,
          "panels": [
            {
              "type": "timeseries",
              "title": "JVM heap used vs max",
              "description": "**JVM Heap-Nutzung und -Grenze (Heap + Non-Heap)**\n\nDrei Kurven: `heap used`, `heap max` (= `-Xmx`), und `nonheap used` (Metaspace, Code-Cache, Direct Buffers).\n\n**Queries:** `jvm_memory_bytes_used{area=\"heap|nonheap\"}` und `jvm_memory_bytes_max{area=\"heap\"}`\n\n**Diagnose:**\n- `heap used` dauerhaft nahe `heap max`, aber Container-Working-Set < Limit → **Heap zu klein** — `-Xmx` / `MaxRAMPercentage` erhöhen\n- `heap used` entspannt, aber Container-Working-Set am Limit → **Native Memory Leak** (NIO, JNI, Netty Direct Buffers) — `NativeMemoryTracking` aktivieren\n- `nonheap used` wächst → Metaspace-Leak (zu viele Klassen, oft durch Reflection/DynamicProxy-Bibliotheken)",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "targets": [
                { "expr": "jvm_memory_bytes_used{namespace=\"$namespace\",pod=\"$pod\",area=\"heap\"}", "legendFormat": "heap used" },
                { "expr": "jvm_memory_bytes_max{namespace=\"$namespace\",pod=\"$pod\",area=\"heap\"}",  "legendFormat": "heap max" },
                { "expr": "jvm_memory_bytes_used{namespace=\"$namespace\",pod=\"$pod\",area=\"nonheap\"}", "legendFormat": "nonheap used" }
              ],
              "fieldConfig": { "defaults": { "unit": "bytes" } }
            },
            {
              "type": "timeseries",
              "title": "JVM GC time (rate)",
              "description": "**Zeit pro Sekunde, die der GC arbeitet**\n\n**Query:** `rate(jvm_gc_collection_seconds_sum[$__rate_interval])`\n\n**Interpretation:**\n- Normale App: < 5 % der CPU in GC\n- > 20 % in GC → GC-Thrashing, Heap vermutlich zu klein → in Kürze OOM oder `GC overhead limit exceeded`\n- Pro GC-Typ separat sichtbar (`G1 Young Generation`, `G1 Old Generation`, `ZGC` usw.) — Old Gen = Vollsammlung, besonders teuer",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "targets": [{
                "expr": "rate(jvm_gc_collection_seconds_sum{namespace=\"$namespace\",pod=\"$pod\"}[$__rate_interval])",
                "legendFormat": "{{gc}}"
              }],
              "fieldConfig": { "defaults": { "unit": "s" } }
            },
            {
              "type": "timeseries",
              "title": "JVM threads",
              "description": "**Anzahl aktiver JVM-Threads**\n\n**Query:** `jvm_threads_current`\n\n**Interpretation:**\n- Stetiges Wachstum → Thread-Leak (z. B. unbegrenzter Executor-Pool, nicht geschlossene HttpClients)\n- Jeder Thread kostet ~1 MiB Stack-Speicher — 10k Threads = 10 GiB nativer Speicher → direkte OOM-Ursache\n- Plötzlicher Sprung → Thread-Storm durch Request-Flut",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "targets": [{ "expr": "jvm_threads_current{namespace=\"$namespace\",pod=\"$pod\"}", "legendFormat": "threads" }]
            }
          ]
        },

        { "type": "row", "title": "Go runtime (if /metrics exposes go_*)", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 52 }, "collapsed": true,
          "panels": [
            {
              "type": "timeseries",
              "title": "Go heap inuse vs sys",
              "description": "**Go Runtime — Heap-Nutzung vs. vom OS reservierter Heap**\n\nDrei Kurven:\n- `heap_inuse` — aktiv genutzter Heap\n- `heap_sys` — gesamter vom OS reservierter Heap (inkl. freier, nicht zurückgegebener Pages)\n- `next_gc` — bei welcher Heap-Größe die nächste GC läuft\n\n**Interpretation:**\n- `heap_sys ≫ heap_inuse` → Go hält viel Speicher, gibt ihn aber nicht schnell ans OS zurück. Lösung: `GOMEMLIMIT` setzen (ca. 80 % des Container-Limits)\n- `heap_inuse` wächst stetig → echter Leak, pprof anwerfen (`go tool pprof http://pod:6060/debug/pprof/heap`)\n- `next_gc` steigt mit `heap_inuse` mit → GC passt sich an, normal",
              "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "targets": [
                { "expr": "go_memstats_heap_inuse_bytes{namespace=\"$namespace\",pod=\"$pod\"}", "legendFormat": "heap_inuse" },
                { "expr": "go_memstats_heap_sys_bytes{namespace=\"$namespace\",pod=\"$pod\"}",   "legendFormat": "heap_sys"   },
                { "expr": "go_memstats_next_gc_bytes{namespace=\"$namespace\",pod=\"$pod\"}",   "legendFormat": "next_gc"    }
              ],
              "fieldConfig": { "defaults": { "unit": "bytes" } }
            },
            {
              "type": "timeseries",
              "title": "Goroutines + GC pause",
              "description": "**Anzahl Goroutines und GC-Aktivität**\n\n- `goroutines` — aktive Goroutines\n- `gc rate` — Zeit, die der GC beschäftigt ist\n\n**Queries:** `go_goroutines`, `rate(go_gc_duration_seconds_sum[$__rate_interval])`\n\n**Interpretation:**\n- Stetig wachsende Goroutines → Goroutine-Leak (häufig fehlende `context` oder blockierte Channel-Receives) → `/debug/pprof/goroutine?debug=2` im Pod auswerten\n- Jede Goroutine nutzt ~8 KiB Stack — 100k+ = mehrere GiB\n- Hohe GC-Rate → GC kann nicht mithalten, Heap wächst → bald OOM",
              "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "targets": [
                { "expr": "go_goroutines{namespace=\"$namespace\",pod=\"$pod\"}", "legendFormat": "goroutines" },
                { "expr": "rate(go_gc_duration_seconds_sum{namespace=\"$namespace\",pod=\"$pod\"}[$__rate_interval])", "legendFormat": "gc rate" }
              ]
            }
          ]
        },

        { "type": "row", "title": "Logs (Loki) — same time range as metrics", "gridPos": { "h": 1, "w": 24, "x": 0, "y": 53 }, "collapsed": false },

        {
          "type": "logs",
          "title": "Error / OOM / GC log lines",
          "description": "**Gefilterte Logzeilen (Loki): nur Fehler/OOM/GC/Heap**\n\nZeigt Logzeilen des ausgewählten Pods, die kritische Schlüsselwörter enthalten.\n\n**Filter-Regex (case-insensitive):** `error|exception|fatal|oom|killed|out ?of ?memory|heap|allocation failed`\n\n**Nutzung:**\n- Zeitbereich ist synchron mit den Metrik-Panels → direkte zeitliche Korrelation mit Speicher-Peaks\n- Klick auf eine Zeile öffnet Volltext-Details\n- Typische Fundstellen bei OOM: `java.lang.OutOfMemoryError`, `killed process N (name)`, `fatal error: runtime: out of memory`",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 54 },
          "datasource": { "type": "loki", "uid": "${loki}" },
          "targets": [{
            "expr": "{namespace=\"$namespace\", pod=\"$pod\"} |~ \"(?i)error|exception|fatal|oom|killed|out ?of ?memory|heap|allocation failed\"",
            "refId": "A"
          }],
          "options": { "showTime": true, "wrapLogMessage": true, "dedupStrategy": "none" }
        },

        {
          "type": "timeseries",
          "title": "Log rate by level (if logs are JSON with a 'level' field)",
          "description": "**Lograte nach Log-Level (funktioniert nur bei JSON-strukturierten Logs)**\n\n**Query:** `sum by (level) (rate({...} | json | __error__=\"\" [$__interval]))`\n\nNur brauchbar, wenn die App JSON-Logs mit einem Feld `level` produziert (z. B. `{\"level\":\"ERROR\", \"msg\":\"...\"}`). Für unstrukturierte Logs bleibt das Panel leer — dann Panel \"Error / OOM / GC log lines\" nutzen.\n\n**Aussage:** Trennt ERROR/WARN/INFO/DEBUG-Raten voneinander — ermöglicht z. B. das schnelle Erkennen plötzlicher WARN-Spikes vor einem OOM.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 64 },
          "datasource": { "type": "loki", "uid": "${loki}" },
          "targets": [{
            "expr": "sum by (level) (rate({namespace=\"$namespace\", pod=\"$pod\"} | json | __error__=\"\" [$__interval]))",
            "legendFormat": "{{level}}"
          }]
        },

        {
          "type": "logs",
          "title": "All logs",
          "description": "**Vollständiger Logstream des ausgewählten Pods**\n\nAlle Logzeilen ohne Filter, im aktuellen Dashboard-Zeitfenster.\n\n**Nutzung:**\n- Nach einem OOM-Event: genau zum Zeitpunkt der roten Annotation scrollen, um die letzten App-Ausgaben vor dem Kill zu sehen\n- Mit `kubectl logs <pod> --previous` kombinieren, um Logs aus dem vorherigen (gekillten) Container-Inkarnation zu erhalten — die stehen in Loki, nicht mehr im laufenden Container",
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 72 },
          "datasource": { "type": "loki", "uid": "${loki}" },
          "targets": [{
            "expr": "{namespace=\"$namespace\", pod=\"$pod\"}",
            "refId": "A"
          }],
          "options": { "showTime": true, "wrapLogMessage": true, "dedupStrategy": "none" }
        }
      ]
    }
