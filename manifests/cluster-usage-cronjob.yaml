# Cluster-wide CronJob that runs fetch-cluster-usage.py against all pid-*
# namespaces and logs the report. The script is shipped via a ConfigMap so no
# image build / registry is needed -- the job runs stock python:3.12-slim.
#
# OpenShift (production) note: thanos-querier requires the ServiceAccount to be
# allowed to read metrics. Uncomment the cluster-monitoring-view binding below
# and set THANOS_URL to the querier route/service.
#
# RKE2 (local test): the kube-prometheus-stack Thanos/Prometheus service in the
# monitoring namespace typically needs no auth; set THANOS_URL accordingly or
# let auto-discovery handle it.
#
# Regenerate the ConfigMap after editing the script:
#   oc create configmap cluster-usage-script \
#     --from-file=fetch-cluster-usage.py=scripts/python/fetch-cluster-usage.py \
#     -n forensic-usage --dry-run=client -o yaml
#
# Persistence: the job writes the human-readable report to stdout (captured by
# Loki/EFK) AND writes resources.csv / ooms.csv / report.json into a per-day
# folder on a PVC: /reports/<YYYY-MM-DD>/. --retention-days prunes old folders.
#
# Retrieving the files (PVC is not browsable on its own):
#   # one-off copy of a day's reports to your machine:
#   oc run usage-reader --image=busybox --restart=Never -n forensic-usage \
#     --overrides='{"spec":{"containers":[{"name":"r","image":"busybox","command":["sleep","3600"],
#       "volumeMounts":[{"name":"r","mountPath":"/reports","readOnly":true}]}],
#       "volumes":[{"name":"r","persistentVolumeClaim":{"claimName":"cluster-usage-reports"}}]}}'
#   oc cp forensic-usage/usage-reader:/reports ./usage-reports
#   oc delete pod usage-reader -n forensic-usage
# Or run the optional read-only viewer Deployment at the bottom of this file
# (needs a ReadWriteMany PVC, or the same node as the CronJob for ReadWriteOnce).
---
apiVersion: v1
kind: Namespace
metadata:
  name: forensic-usage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-usage
  namespace: forensic-usage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-usage-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-usage-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-usage-read
subjects:
  - kind: ServiceAccount
    name: cluster-usage
    namespace: forensic-usage
---
# OpenShift only: lets the SA token query thanos-querier. Harmless to omit on
# clusters where Thanos needs no auth (RKE2/KPS).
# apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRoleBinding
# metadata:
#   name: cluster-usage-monitoring
# roleRef:
#   apiGroup: rbac.authorization.k8s.io
#   kind: ClusterRole
#   name: cluster-monitoring-view
# subjects:
#   - kind: ServiceAccount
#     name: cluster-usage
#     namespace: forensic-usage
---
# Report storage. Reports are tiny (CSV/JSON), so 1Gi is generous even with a
# long --retention-days. Prefer ReadWriteMany if your storage class supports it
# (OpenShift ODF/NFS; Longhorn-RWX on RKE2) so the viewer below can read while
# the CronJob writes; ReadWriteOnce works too (single writer) but a reader pod
# must land on the same node. Set storageClassName to your default if needed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cluster-usage-reports
  namespace: forensic-usage
spec:
  accessModes: ["ReadWriteOnce"]   # change to ReadWriteMany if supported
  resources:
    requests:
      storage: 1Gi
  # storageClassName: <your-storage-class>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-usage-script
  namespace: forensic-usage
data:
  fetch-cluster-usage.py: |
    # PLACEHOLDER -- replace with the real script via:
    #   oc create configmap cluster-usage-script \
    #     --from-file=fetch-cluster-usage.py=scripts/python/fetch-cluster-usage.py \
    #     -n forensic-usage --dry-run=client -o yaml | oc apply -f -
    raise SystemExit("ConfigMap not populated; see manifest header")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cluster-usage
  namespace: forensic-usage
spec:
  schedule: "0 6 * * *"   # daily 06:00; matches the default 24h window
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: cluster-usage
          restartPolicy: Never
          # Writability: python:3.12-slim runs as root and writes the PVC fine
          # on RKE2. On OpenShift the restricted SCC assigns a random UID and an
          # fsGroup from the namespace range and chowns the volume to it, so the
          # default below is usually enough. If writes fail with "Permission
          # denied", uncomment fsGroup and set it to a GID your SCC allows.
          securityContext: {}
            # fsGroup: 0
          containers:
            - name: cluster-usage
              image: python:3.12-slim
              command: ["python3", "/app/fetch-cluster-usage.py"]
              # text -> stdout (Loki); CSV/JSON -> /reports/<date>/; keep 30 days
              args:
                - "--in-cluster"
                - "--window"
                - "24h"
                - "--format"
                - "text"
                - "--output-dir"
                - "/reports"
                - "--date-subdir"
                - "--retention-days"
                - "30"
              env:
                - name: THANOS_URL
                  value: ""   # set to your querier, e.g.
                              # http://thanos-querier.openshift-monitoring:9091
                              # (OpenShift) — add --insecure in args if a route
              volumeMounts:
                - name: script
                  mountPath: /app
                - name: reports
                  mountPath: /reports
              resources:
                requests: { cpu: 50m, memory: 128Mi }
                limits:   { cpu: 500m, memory: 256Mi }
          volumes:
            - name: script
              configMap:
                name: cluster-usage-script
            - name: reports
              persistentVolumeClaim:
                claimName: cluster-usage-reports
---
